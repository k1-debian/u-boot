# --
build-hippo_uImage_msc0-job:       # This job runs in the build stage, which runs first.
  stage: build
  variables:
    BUILD_CONFIG: hippo_uImage_msc0
    BUILD_DIR: tmp.build.$BUILD_CONFIG
  script:
    - echo "开始编译 <$BUILD_CONFIG>..."
    - mkdir -p $BUILD_DIR
    - make O=$BUILD_DIR -C . $BUILD_CONFIG

  artifacts:
    paths:
      - $BUILD_DIR/u-boot-with-spl-mbr-gpt.bin
      - $BUILD_DIR/u-boot
      - $BUILD_DIR/spl/u-boot-spl

